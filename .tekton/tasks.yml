apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: output
  steps:
    - name: remove-old-files
      image: alpine:latest
      script: |
        #!/bin/sh
        echo "Cleaning up workspace..."
        rm -rf $(workspaces.output.path)/*
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: test
spec:
  params:
    - name: python-image
      type: string
      default: "python:3.9"
  workspaces:
    - name: source
  steps:
    - name: run-nose
      image: $(params.python-image)
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        pip install -r requirements.txt
        nosetests